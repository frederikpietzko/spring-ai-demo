[versions]
kotlin = "2.4.21"
springBoot = "4.2.0-RC2"
springAi = "2.1.0-RC2"
exposed = "1.6.1"
composeMultiplatform = "1.12.2"
detekt = "2.0.0-alpha.6"
junit = "6.1.3"
kotlinx-coroutines = "1.11.0"
archunit = "1.5.1"
kotlinx-serialization = "1.11.0"
ktor = "3.6.1"
# Not managed by the Spring AI BOM; pinned on purpose (ADR-0007).
springAiAgentUtils = "0.13.0"
# Community MCP security (ADR-0009): built against Spring AI 2.0, verified by this project on 2.1.0-RC2.
mcpSecurity = "0.1.14"
# kaiju CLI (ADR-0011): clikt-core without mordant, which keeps the native image free of terminal libraries.
clikt = "5.2.1"
# Native image of the kaiju CLI (ADR-0011); GraalVM 25 only for :cli:nativeCompile.
graalvmNative = "1.1.18"

[libraries]
# Plugins used by the convention plugin in build-logic
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-powerAssertPlugin = { module = "org.jetbrains.kotlin:kotlin-power-assert", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

# Test tooling
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }

# Chat protocol (shared by backend and desktop)
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Backend
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
exposed-spring-boot-starter = { module = "org.jetbrains.exposed:exposed-spring-boot4-starter", version.ref = "exposed" }
exposed-migration-jdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }
# core-mcp: timestamp with time zone columns
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
# Adjuster todo list and skills (TodoWriteTool, SkillsTool), ADR-0007
spring-ai-agent-utils = { module = "org.springaicommunity:spring-ai-agent-utils", version.ref = "springAiAgentUtils" }
archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }

# MCP security (ADR-0009): plain modules only, no *-spring-boot auto-configuration modules
mcp-authorization-server = { module = "org.springaicommunity:mcp-authorization-server", version.ref = "mcpSecurity" }
mcp-server-security = { module = "org.springaicommunity:mcp-server-security", version.ref = "mcpSecurity" }
mcp-client-security = { module = "org.springaicommunity:mcp-client-security", version.ref = "mcpSecurity" }

# Desktop
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

# kaiju CLI
clikt-core = { module = "com.github.ajalt.clikt:clikt-core", version.ref = "clikt" }
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
exposed = { id = "org.jetbrains.exposed.plugin", version.ref = "exposed" }
graalvmNative = { id = "org.graalvm.buildtools.native", version.ref = "graalvmNative" }
