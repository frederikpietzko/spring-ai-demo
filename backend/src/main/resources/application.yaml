spring:
  application:
    name: spring-ai-demo-backend
  datasource:
    # Local-development defaults only; they match compose.yaml. Override with the environment in any other setup.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/backend}
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:demo}
  exposed:
    # The schema is created by Flyway migrations only, never by Exposed at startup.
    generate-ddl: false
  flyway:
    # db/migration is written by the Exposed generator; db/vector holds the hand-written pgvector DDL (ADR-0006) and
    # db/session the hand-written DDL of the Session Memory store.
    locations: classpath:db/migration,classpath:db/vector,classpath:db/session
  docker:
    compose:
      # No `file` here: Spring Boot finds compose.yaml in the working directory. The repo root has the real file and
      # backend/compose.yaml is a symlink to it, so starting from either directory uses the same compose project.
      lifecycle-management: start_only
  ai:
    model:
      # Explicit since the Ollama starter also offers a chat model; without this two chat models would exist.
      chat: anthropic
      embedding: ollama
      # The claimant chat's prompt-injection guardrail (GuardrailAdvisor) asks the Ollama decision model. Ollama 0.40.4
      # or later serves it; on an older Ollama every claimant message fails closed (README, Prerequisites).
      decision: ollama
    anthropic:
      chat:
        model: claude-haiku-5-5
      # No api-key here: the Anthropic SDK reads ANTHROPIC_API_KEY from the environment.
    ollama:
      # Override with SPRING_AI_OLLAMA_BASE_URL; Spring AI does not read OLLAMA_HOST.
      base-url: http://localhost:11434
      embedding:
        # 768 dimensions, matching the vector_store column; the library default is mxbai-embed-large (1024).
        model: nomic-embed-text
      decision:
        # The library default, written down. No pull-model-strategy: the default `never` keeps startup offline, so
        # pull the model once by hand (`ollama pull d1-omni:600m`).
        model: d1-omni:600m
    vectorstore:
      pgvector:
        # Flyway owns the DDL (db/vector, ADR-0006); the store only checks the table at startup.
        initialize-schema: false
        schema-validation: true
        dimensions: 768
        # Readable, stable chunk ids such as policy-wording/exclusions.md#0-0 instead of UUIDs.
        id-type: text
      observations:
        # Off by default, written down so the switch is visible: would log the retrieved clauses (ADR-0010).
        log-query-response: false
    session:
      repository:
        jdbc:
          # Flyway owns the DDL (db/session, ADR-0002). The default (embedded) only skips PostgreSQL by accident.
          initialize-schema: never
          # Lets the conversation list find the claimant's sessions with findByMetadata(agentName, "claimant").
          indexed-attributes: agentName
    # Content stays out of telemetry (ADR-0010). All of these are the library defaults; they are written down so
    # turning one on is a visible, deliberate change. The retrieval query is dropped by ObservabilityConfiguration.
    chat:
      observations:
        log-prompt: false
        log-completion: false
      client:
        observations:
          log-prompt: false
          log-completion: false
    mcp:
      client:
        # Connect on the first adjuster request instead of at startup, so the backend starts without core-mcp.
        initialized: false
        toolcallback:
          # The auto-configured provider would publish the tools of both connections under the same names. Each
          # persona gets its own provider instead (adjusterCoreTools, claimantCoreTools in McpClientConfiguration).
          enabled: false
        streamable-http:
          connections:
            # The insurer core system (core-mcp, ADR-0003 port 8081; the default endpoint /mcp matches it), once per
            # persona: each connection sends its persona's token (ADR-0009, McpClientOAuthConfiguration).
            core-adjuster:
              url: ${CORE_MCP_URL:http://localhost:8081}
            core-claimant:
              url: ${CORE_MCP_URL:http://localhost:8081}
    tools:
      observations:
        # The one switch that adds tool arguments and results to the spans as attributes.
        include-content: false
      confirmation:
        # A payout waits for a human decision. By name, because MCP tools carry no requiresConfirmation flag.
        tools: issuePayout

# The agents' OAuth clients at the auth-server (ADR-0009). The secret defaults are local-development values only,
# the same as in auth-server's application.yaml; set the environment variables everywhere else.
agents:
  # The auth-server; tokens come from <url>/oauth2/token.
  auth-server-url: ${AUTH_SERVER_URL:http://localhost:9000}
  claimant:
    secret: ${CLAIMANT_AGENT_SECRET:claimant-local-secret}
  adjuster:
    secret: ${ADJUSTER_AGENT_SECRET:adjuster-local-secret}

management:
  tracing:
    sampling:
      # The default is 0.1: most demo traces would be missing.
      probability: 1.0
  otlp:
    metrics:
      export:
        # The default is 1m: the dashboard would feel dead.
        step: 10s
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
  opentelemetry:
    otlp:
      # Fallback for a started jar; in bootRun Docker Compose support points the exporters at the lgtm container.
      endpoint: http://localhost:4318
