# Fixed project name so every start location (repo root, backend/ via symlink) shares one container and volume.
name: spring-ai-demo

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      # Local development only. Not a secret.
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
